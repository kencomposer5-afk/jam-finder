name: 会場・セッション情報の報告
description: 新しい会場の追加、開催日の変更、休止の報告
title: "[会場] "
labels: ["venue-report"]
body:
  - type: input
    id: name
    attributes: { label: 店名, placeholder: "例: ○○ジャズバー" }
    validations: { required: true }
  - type: dropdown
    id: pref
    attributes: { label: 都県, options: [東京, 埼玉, 神奈川, 千葉] }
    validations: { required: true }
  - type: input
    id: area
    attributes: { label: 最寄り駅・エリア, placeholder: "例: 高円寺" }
  - type: checkboxes
    id: genre
    attributes: { label: ジャンル, options: [{ label: ジャズ }, { label: ブルース }, { label: ロック }, { label: ファンク/ソウル }, { label: ポップス }, { label: クラシック }, { label: ジャンル問わず }] }
  - type: textarea
    id: schedule
    attributes:
      label: 開催日時
      description: "「毎週木曜 19:30〜22:30」「第2・4日曜 18:00〜」のように。告知文のコピペでもOK"
    validations: { required: true }
  - type: input
    id: fee
    attributes: { label: 料金, placeholder: "例: 1,500円+1ドリンク" }
  - type: input
    id: url
    attributes: { label: 公式サイト/Instagram/X のURL(情報の根拠) }
    validations: { required: true }
  - type: textarea
    id: note
    attributes: { label: 参加条件・備考(予約制、初心者歓迎、ホストバンド等) }
