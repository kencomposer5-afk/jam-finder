name: Weekly venue check
on:
  schedule:
    - cron: "0 21 * * 0"   # 毎週月曜 06:00 JST
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/watch.py
      - name: Save state
        run: |
          git config user.name "jam-bot"
          git config user.email "jam-bot@users.noreply.github.com"
          git add watch/state.json watch/report.md
          git diff --cached --quiet || (git commit -m "chore: weekly venue check" && git pull --rebase origin main && git push)
      - name: Post report as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="週次チェック: 要確認の会場"
          n=$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number')
          if grep -q '^### ' watch/report.md; then
            if [ -n "$n" ]; then gh issue edit "$n" --body-file watch/report.md
            else gh issue create --title "$title" --body-file watch/report.md; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "今週は要確認の項目がなくなりました。"
          fi
