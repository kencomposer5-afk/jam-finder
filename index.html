<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jam Finder 東京</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14110f">
<link rel="stylesheet" href="app.css?v=5">
</head>
<body>
<header>
  <h1>🎷 Jam Finder <small>首都圏 参加OKセッション(ジャズ・ブルースほか)</small></h1>
  <div id="updated"></div>
</header>
<section class="filters">
  <div class="chips" id="genre">
    <button data-v="" class="on">すべて</button>
  </div>
  <div class="chips" id="view">
    <button data-v="cal" class="on">📅 カレンダー</button><button data-v="list">☰ リスト</button>
  </div>
  <div class="chips" id="pref">
    <button data-v="" class="on">全域</button><button data-v="東京">東京</button><button data-v="埼玉">埼玉</button><button data-v="神奈川">神奈川</button><button data-v="千葉">千葉</button>
  </div>
  <div class="chips" id="range">
    <button data-v="today">今日</button><button data-v="weekend">今週末</button>
    <button data-v="week">7日間</button><button data-v="all" class="on">全期間</button>
  </div>
  <select id="area"><option value="">全エリア</option></select>
  <input id="q" type="search" placeholder="店名・楽器で検索">
</section>
<main><div id="cal"></div><div id="day"></div><div id="list" hidden></div></main>
<footer>
  <p>掲載は一部の会場のみです。情報は変わることがあるので、行く前に公式で確認を。</p>
  <p><a href="https://github.com/kencomposer5-afk/jam-finder/issues/new?template=venue-report.yml" target="_blank" rel="noopener">＋ 会場・日程の追加/訂正を報告</a></p>
  <p>他の会場を探す(外部サイト): <a href="https://enso-music.jp/sessions/genre/jazz" target="_blank" rel="noopener">セッションマップ</a> / <a href="https://kyoujazz.com/" target="_blank" rel="noopener">今日ジャズ</a></p>
</footer>
<script src="app.js?v=5"></script>
</body>
</html>
